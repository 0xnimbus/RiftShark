<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RiftShark — play & coach</title>
<link rel="stylesheet" href="style.css">
<style>
.play-layout { display: grid; grid-template-columns: 1fr 340px; gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
.panel h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
#options button { display: block; width: 100%; text-align: left; margin: 4px 0; }
#options button.best { border-color: var(--good); }
.grade { display: inline-block; padding: 2px 8px; border-radius: 6px; font-weight: 700; color: #fff; }
.grade.best { background: #2e7d32; } .grade.good { background: #388e3c; } .grade.inaccuracy { background: #f9a825; color: #000; }
.grade.mistake { background: #ef6c00; } .grade.blunder { background: #c62828; } .grade.only { background: #455a64; }
.alt { font-size: 12px; color: var(--muted); }
.alt b { color: var(--text); }
#log { font-size: 12px; max-height: 260px; overflow: auto; }
#log .me { color: var(--text); }
select, input[type=number] { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
.busy { opacity: .5; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>RiftShark</h1>
  <nav><a href="index.html" class="navlink">Dashboard</a> <span class="muted">· Play &amp; coach</span></nav>
</header>
<main>
  <div class="panel" id="setup">
    <h3>New game</h3>
    <div class="controls">
      <label>You play <select id="deck0"></select></label>
      <label>AI plays <select id="deck1"></select></label>
      <label>Seat <select id="human"><option value="0">first (P0)</option><option value="1">second (P1)</option></select></label>
      <label>AI strength <select id="ai"><option value="greedy">greedy (fast)</option><option value="mcts:60">mcts 60</option><option value="mcts:150" selected>mcts 150</option><option value="mcts:400">mcts 400 (slow)</option></select></label>
      <label>Coach depth <input id="analysis" type="number" value="150" min="20" max="2000" style="width:70px"></label>
      <label>Seed <input id="seed" type="number" value="0" style="width:60px"></label>
      <button id="btn-new">Start</button>
      <span id="status" class="muted"></span>
    </div>
    <div id="mode" class="alt"></div>
  </div>
  <div class="play-layout">
    <div>
      <div id="board">
        <div class="player-strip" id="p1-strip"></div>
        <div class="field">
          <div class="base" id="base-1"></div>
          <div class="battlefields" id="bfs"></div>
          <div class="base" id="base-0"></div>
        </div>
        <div class="player-strip" id="p0-strip"></div>
        <div class="chain" id="chain"></div>
      </div>
    </div>
    <aside>
      <div class="panel"><h3>Your move</h3><div id="decision" class="muted">Start a game.</div><div id="options"></div>
        <div class="controls"><button id="btn-hint">Hint (top lines)</button></div><div id="hint" class="alt"></div></div>
      <div class="panel"><h3>Coach</h3><div id="review" class="muted">Every move you make is rated against the engine's best line.</div></div>
      <div class="panel"><h3>Game accuracy</h3><div id="summary" class="alt">–</div></div>
      <div class="panel"><h3>Log</h3><div id="log"></div></div>
    </aside>
  </div>
</main>
<div id="tooltip" hidden></div>
<script src="board.js"></script>
<script src="play.js"></script>
</body>
</html>
